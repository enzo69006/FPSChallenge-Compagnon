      - name: page
        in: query
        required: false
        description: Page number (1-based).
        schema:
          type: integer
          minimum: 1
      - name: competitionType
        in: query
        required: false
        description: Filter by competition.
        schema:
          type: string
          enum:
          - ladder
          - tournament
          - matchmaking
      responses:
        '200':
          description: Page of matches.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PeopleResourcePage'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PeopleProfileMatch'
                  required:
                  - data
        '404':
          description: 'No active user with that username: `{"message": "User not found."}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
        '422':
          $ref: '#/components/responses/Validation'
  /user/{username}/nickname-history:
    get:
      operationId: getUserNicknameHistory
      tags:
      - Users
      summary: Username change history
      description: Newest first. `changedAt` is a formatted local time in the server timezone (Europe/Bratislava). Not cached.
      parameters:
      - name: username
        in: path
        required: true
        description: Username of an active account (exact match).
        schema:
          type: string
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeopleNicknameHistoryEntry'
                required:
                - data
        '404':
          description: 'No active user with that username: `{"message": "User not found."}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /user/{username}/progress:
    get:
      operationId: getUserProgress
      tags:
      - Progression
      summary: Level / XP progress
      description: Current level computed from the user's total XP. Not cached.
      parameters:
      - name: username
        in: path
        required: true
        description: Username of an active account (exact match).
        schema:
          type: string
      responses:
        '200':
          description: Progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      level:
                        $ref: '#/components/schemas/PeopleLevelProgress'
                    required:
                    - level
                required:
                - data
        '404':
          description: 'No active user with that username: `{"message": "User not found."}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /user/{username}/teams:
    get:
      operationId: getUserTeams
      tags:
      - Users
      summary: Teams of a user (6 per page)
      description: Accepted team memberships, 6 per page. Paging in `links` and `meta`. The team item has no `name` field.
      parameters:
      - name: username
        in: path
        required: true
        description: Username of an active account (exact match).
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number (1-based).
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Page of teams.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PeopleResourcePage'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PeopleUserTeam'
                  required:
                  - data
        '404':
          description: 'No active user with that username: `{"message": "User not found."}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
        '422':
          $ref: '#/components/responses/Validation'
  /users/search:
    get:
      operationId: searchUsers
      tags:
      - Users
      summary: Username autocomplete
      description: Prefix match on the username (wildcard characters are literal), active users only, exact match first then
        shortest, at most 10. An empty `q` returns `[]`. Not cached.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Matches.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  type: object
                  required:
                  - value
                  - image
                  properties:
                    value:
                      type: string
                      description: Username.
                    image:
                      type: string
                      format: uri
                      description: Avatar URL (stock avatar when none).
components:
  responses:
    NotFound:
      description: Record not found. The body is an HTML page, not JSON.
      content:
        text/html:
          schema:
            type: string
    Validation:
      description: Invalid query parameters.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                description: Field name -> list of error messages.
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
            - message
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    CoreRegion:

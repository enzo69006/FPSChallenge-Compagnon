openapi: 3.1.0
info:
  title: FPSChallenge Public API
  version: 0.1.0-preview
  summary: Read-only public data API of fpschallenge.eu for community apps.
  description: "Read-only JSON API of fpschallenge.eu for community-made apps, bots and tools: tournaments, ladders, solo\n\
    queues, leaderboards, player and team profiles, match results and match statistics.\n\n## Status\n\nThis is the same API\
    \ the fpschallenge.eu website uses. It is published as a **preview**: response shapes\nfollow what the website needs and\
    \ can change with website releases. Build tolerant clients (ignore unknown\nfields, expect nullable values).\n\n## Access\n\
    \n- All endpoints in this document are public and need no login or API key.\n- Logged-in features (joining queues and\
    \ tournaments, match actions, chat, friends, notifications) are not\n  part of the public API yet. They will be offered\
    \ through OAuth for third-party apps later. Do not ask users\n  for their FPSChallenge password.\n- Send `Accept: application/json`\
    \ on every request.\n- Be gentle: cache responses on your side, avoid crawling and keep to a few requests per second.\
    \ Some\n  endpoints are rate limited and answer `429 Too Many Requests` when the limit is hit. Abusive traffic is\n  blocked.\n\
    - Most read endpoints are cached by the server for 30 seconds to 10 minutes, so polling faster than that\n  returns the\
    \ same data.\n\n## Conventions\n\n- **Errors:** an unknown record answers `404` with an HTML page (not JSON). Invalid\
    \ query parameters answer\n  `422` with `{\"message\": \"...\", \"errors\": {\"field\": [\"...\"]}}`.\n- **Pagination**\
    \ is not uniform yet. Each endpoint's schema shows which shape it uses: `data` + `links` +\n  `meta`, `{items, currentPage,\
    \ lastPage, total}`, `{data, meta: {currentPage, ...}}` or flat `current_page`\n  fields.\n- **Dates and times** are given\
    \ as unix timestamps where available, otherwise as `Y-m-d H:i:s` strings in\n  the Europe/Bratislava timezone.\n- **Images**\
    \ (avatars, team logos, game and map images) are absolute CDN URLs unless a field says otherwise.\n- Some fields contain\
    \ small HTML fragments meant for the website (for example formatted usernames). They\n  are marked in their descriptions;\
    \ prefer the plain fields next to them.\n\n## Terms\n\nRespect the FPSChallenge terms of use (https://fpschallenge.eu).\
    \ Do not present your app as an official\nFPSChallenge app, and do not use the data to harass or track players.\n"
servers:
- url: https://fpschallenge.eu/api/v1
  description: Production
security: []
paths:
  /frs:
    get:
      operationId: getFrsLeaderboard
      tags:
      - FRS
      summary: FRS points leaderboard
      description: 'FPSChallenge Ranking System (FRS) points per player for one game and season: the sum over the season''s
        tournaments in every region, ordered by total points descending, 50 per page. Pass `system` explicitly (pick a key
        from `available_systems`); when it is omitted a default season is used. Cached for about 60 seconds.'
      parameters:
      - name: game_id
        in: query
        required: true
        schema:
          type: integer
        description: Game id. Missing or 0 returns 422; an unknown id returns 404.
      - name: system
        in: query
        required: false
        schema:
          type: string
        description: FRS season key (e.g. `2026`). An unknown key returns an empty page.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Leaderboard (or the empty variant when no season exists)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CompFrsLeaderboard'
                - $ref: '#/components/schemas/CompFrsLeaderboardEmpty'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`Please select a game.`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
  /games:
    get:
      operationId: listGames
      tags:
      - Reference data
      summary: Visible games
      description: Visible games, in display order. Cached for about an hour.
      responses:
        '200':
          description: Games.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoreGame'
  /games/{game}/guide:
    get:
      operationId: getGameGuide
      tags:
      - Play
      summary: Setup guide of a game
      description: Published setup guide of a game. Lines in `items` are sanitised inline HTML rendered from Markdown. Cached
        for about 10 minutes. Returns 404 when the game is hidden or has no published guide.
      parameters:
      - name: game
        in: path
        required: true
        description: Game slug (max 6 chars, e.g. cod4, cod2, cod1).
        schema:
          type: string
      responses:
        '200':
          description: Guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreGameGuide'
        '404':
          description: 'Unknown slug (standard 404) or no published guide (`{message: "This game has no guide yet."}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /h2h/player/{username}/{otherUsername}:
    get:
      operationId: getPlayerHeadToHead
      tags:
      - Head to head
      summary: Player vs player summary
      description: Record and stats of two players as opponents and as teammates, plus CoD4 duels from the kill feed of finished
        maps (null when there are none). Usernames are matched case-insensitively among active users; 404 when either is missing
        or both name the same account. Cached for about 5 minutes. Rate limited to 60 requests per minute per client (429
        when exceeded).
      parameters:
      - name: username
        in: path
        required: true
        description: Username of an active account (exact match).
        schema:
          type: string
      - name: otherUsername
        in: path
        required: true
        description: Username of the second active account.
        schema:
          type: string
      - name: game
        in: query
        required: false
        description: Restrict to one game slug (must exist).
        schema:
          type: string
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeoplePlayerHeadToHead'
                required:
                - data
        '404':
          description: '`{"message": "Player not found."}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: 'Rate limit exceeded (`{"message": "Too Many Attempts."}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /h2h/player/{username}/{otherUsername}/matches:
    get:
      operationId: getPlayerHeadToHeadMatches
      tags:
      - Head to head
      summary: Matches between / with two players
      description: Their meetings, newest first, 10 per page, in the same item shape as the user match list. "home" is `username`'s
        team and `honours` are `username`'s badges. Rate limited to 60 requests per minute per client (429 when exceeded).
      parameters:
      - name: username
        in: path
        required: true
        description: Username of an active account (exact match).
        schema:
          type: string
      - name: otherUsername
        in: path
        required: true
        description: Username of the second active account.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number (1-based).
        schema:
          type: integer
          minimum: 1
      - name: game
        in: query
        required: false
        description: Restrict to one game slug (must exist).
        schema:
          type: string
      - name: relation
        in: query
        required: false
        description: opponents (default) or teammates.
        schema:
          type: string
          enum:
          - opponents
          - teammates
      responses:
        '200':
          description: Page of matches.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PeopleResourcePage'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PeopleProfileMatch'
                  required:
                  - data
        '404':
          description: '`{"message": "Player not found."}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: 'Rate limit exceeded (`{"message": "Too Many Attempts."}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /h2h/team/{teamId}/{otherTeamId}:
    get:
      operationId: getTeamHeadToHead
      tags:
      - Head to head
      summary: Team vs team summary
      description: Record, last meeting and top performers of two teams (up to 5 per side, players who played at least 25
        % of the meetings). Teams are addressed by numeric id; temporary or inactive teams, or the same id twice, return 404.
        Cached for about 5 minutes. Rate limited to 60 requests per minute per client (429 when exceeded).
      parameters:
      - name: teamId
        in: path
        required: true
        description: Numeric id of an active, non-temporary team.
        schema:
          type: integer
      - name: otherTeamId
        in: path
        required: true
        description: Numeric id of the second team.
        schema:
          type: integer
      - name: game
        in: query
        required: false
        description: Restrict to one game slug (must exist).
        schema:
          type: string
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeopleTeamHeadToHead'
                required:
                - data
        '404':
          description: '`{"message": "Team not found."}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: 'Rate limit exceeded (`{"message": "Too Many Attempts."}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /h2h/team/{teamId}/{otherTeamId}/matches:
    get:
      operationId: getTeamHeadToHeadMatches
      tags:
      - Head to head
      summary: Matches between two teams
      description: Meetings of the two teams, newest first, 10 per page, in the user match list item shape with "home" = `teamId`.
        `honours` are always false here. Rate limited to 60 requests per minute per client (429 when exceeded).
      parameters:
      - name: teamId
        in: path
        required: true
        description: Numeric id of an active, non-temporary team.
        schema:
          type: integer
      - name: otherTeamId
        in: path
        required: true
        description: Numeric id of the second team.
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Page number (1-based).
        schema:
          type: integer
          minimum: 1
      - name: game
        in: query
        required: false
        description: Restrict to one game slug (must exist).
        schema:
          type: string
      responses:
        '200':
          description: Page of matches.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PeopleResourcePage'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PeopleProfileMatch'
                  required:
                  - data
        '404':
          description: '`{"message": "Team not found."}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: 'Rate limit exceeded (`{"message": "Too Many Attempts."}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /h2h/teams/search:
    get:
      operationId: searchHeadToHeadTeams
      tags:
      - Head to head
      summary: Search teams by name
      description: Up to 10 active, non-temporary teams whose name contains `q` (exact match first, then prefix matches, then
        shortest names). Rate limited to 60 requests per minute per client (429 when exceeded).
      parameters:
      - name: q
        in: query
        required: true
        description: Name fragment, 2-32 chars.
        schema:
          type: string
          minLength: 2
          maxLength: 32
      responses:
        '200':
          description: Teams.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeopleH2HTeam'
                required:
                - data
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: 'Rate limit exceeded (`{"message": "Too Many Attempts."}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleMessage'
  /home:
    get:
      operationId: getHome
      tags:
      - Home
      summary: Homepage data
      description: Site stats, game activity, live streamers (Twitch and YouTube), the latest 6 news, 5 tournaments and 4
        polls. Each section is cached for about 60 seconds. News `updatedAt`, tournament `start` and poll `expiresAt` are
        local time `Y-m-d H:i:s` in the server timezone (Europe/Bratislava), no offset.
      responses:
        '200':
          description: Homepage data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreHomeData'
  /ladder/{region}/{game}/{leagueSlug}:
    get:
      operationId: getLadder
      tags:
      - Ladders
      summary: Ladder overview
      description: Ladder header data. The fields `isLoggedIn`, `isSupporter`, `myCaptainTeams` and `myReadyTeamId` are only
        filled for logged-in website users (false, empty or null for API clients). Not cached.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: leagueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Ladder slug within the region and game. An unknown or deleted ladder returns 404 `{message: ''Ladder
          not found''}`.'
      responses:
        '200':
          description: Ladder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompLadderShow'
        '404':
          description: 'Unknown region/game slug, or ladder not found (`{message: ''Ladder not found''}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
  /ladder/{region}/{game}/{leagueSlug}/leaderboard:
    get:
      operationId: getLadderLeaderboard
      tags:
      - Ladders
      summary: Ladder player stats leaderboard
      description: Per-player stats of this ladder, 25 per page. Totals are refreshed about every 20 minutes and the list
        is cached for about 60 seconds. FPS Rating is damped by rounds/500. `currentUser` is only filled for logged-in website
        users; null for API clients.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: leagueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Ladder slug within the region and game. An unknown or deleted ladder returns 404 `{message: ''Ladder
          not found''}`.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (integer >= 1, otherwise 422).
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Accepted but not used; the page size is fixed.
      - name: competitionType
        in: query
        required: false
        schema:
          type: string
          enum:
          - ladder
          - tournament
          - matchmaking
        description: Accepted (422 on other values) but not used by this endpoint.
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive substring match on the username.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - fpsRating
          - games
          - maps
          - score
          - kd
          - kills
          - assists
          - deaths
          - grenades
          - plants
          - defuses
          - headshots
          - damage
          - accuracy
        description: 'Sort column. Unknown values are ignored (default order: FPS Rating, then K/D, then score). `rank` in
          each row stays the overall rank.'
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Anything other than `asc` means `desc`.
      - name: view
        in: query
        required: false
        schema:
          type: string
          default: average
        description: '`absolute` sorts by totals; any other value (default `average`) sorts by per-map averages. Only affects
          sorting - every row always carries both average and `*Absolute` values.'
      responses:
        '200':
          description: Paginated leaderboard
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CompResourcePaginator'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CompLeaderboardRow'
                    slug:
                      type: string
                      description: Game slug (drives which columns apply).
                    currentUser:
                      $ref: '#/components/schemas/CompLeaderboardPinnedRow'
                  required:
                  - slug
        '404':
          description: 'Unknown region/game slug, or ladder not found (`{message: ''Ladder not found''}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
        '422':
          $ref: '#/components/responses/Validation'
  /ladder/{region}/{game}/{leagueSlug}/matches:
    get:
      operationId: getLadderMatches
      tags:
      - Ladders
      summary: Ladder matches
      description: Recent ladder matches (accepted / player picker / location picker / ongoing / disputed / score entered
        / finished), newest first, 10 per page. Scores of finished matches count confirmed maps only. Not cached.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: leagueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Ladder slug within the region and game. An unknown or deleted ladder returns 404 `{message: ''Ladder
          not found''}`.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (integer >= 1, otherwise 422).
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Accepted but not used; the page size is fixed.
      - name: competitionType
        in: query
        required: false
        schema:
          type: string
          enum:
          - ladder
          - tournament
          - matchmaking
        description: Accepted (422 on other values) but not used by this endpoint.
      responses:
        '200':
          description: Paginated matches
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CompResourcePaginator'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CompCompetitionMatch'
        '404':
          description: 'Unknown region/game slug, or ladder not found (`{message: ''Ladder not found''}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
        '422':
          $ref: '#/components/responses/Validation'
  /ladder/{region}/{game}/{leagueSlug}/ranking:
    get:
      operationId: getLadderRanking
      tags:
      - Ladders
      summary: Ladder team ranking
      description: Teams with at least one played ladder match, ranked by ELO (ELO ladders) or by points = 4*wins + 2*losses
        + elo, then wins, then id. 25 per page. `search` is a team-name prefix match (exact match first, then shortest name);
        ranks stay the overall ranks. `currentUser` and `isEligibleForMatch` are only meaningful for logged-in website users.
        Not cached.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: leagueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Ladder slug within the region and game. An unknown or deleted ladder returns 404 `{message: ''Ladder
          not found''}`.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (integer >= 1, otherwise 422).
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Accepted but not used; the page size is fixed.
      - name: competitionType
        in: query
        required: false
        schema:
          type: string
          enum:
          - ladder
          - tournament
          - matchmaking
        description: Accepted (422 on other values) but not used by this endpoint.
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Team name prefix.
      responses:
        '200':
          description: Paginated teams
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CompResourcePaginator'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CompLadderTeam'
        '404':
          description: 'Unknown region/game slug, or ladder not found (`{message: ''Ladder not found''}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
        '422':
          $ref: '#/components/responses/Validation'
  /ladder/{region}/{game}/{leagueSlug}/ready-teams:
    get:
      operationId: getLadderReadyTeams
      tags:
      - Ladders
      summary: Teams ready to play
      description: Active teams flagged ready to play in this ladder and region, by ELO descending. `isOwnTeam` is only filled
        for logged-in website users (false for API clients). Not paginated, not cached.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: leagueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Ladder slug within the region and game. An unknown or deleted ladder returns 404 `{message: ''Ladder
          not found''}`.'
      responses:
        '200':
          description: Ready teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompReadyTeam'
                required:
                - data
                additionalProperties: false
        '404':
          description: 'Unknown region/game slug, or ladder not found (`{message: ''Ladder not found''}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
  /ladder/{region}/{game}/{leagueSlug}/rules:
    get:
      operationId: getLadderRules
      tags:
      - Ladders
      summary: Ladder rules
      description: Rules of the ladder's ruleset.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: leagueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Ladder slug within the region and game. An unknown or deleted ladder returns 404 `{message: ''Ladder
          not found''}`.'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompRule'
                required:
                - data
                additionalProperties: false
        '404':

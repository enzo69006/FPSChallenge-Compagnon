          type: boolean
          description: In the ladder ranking any accepted membership counts as captain here.
        isFounder:
          type: boolean
          description: Always false in the ladder ranking.
        hasPendingInvitation:
          type: boolean
          description: Always false in the ladder ranking.
      required:
      - isMember
      - isCaptain
      - isFounder
      - hasPendingInvitation
      description: Viewer's relation to the team. Only filled for logged-in website users; false for API clients.
      additionalProperties: false
    CompLadderTeam:
      type: object
      properties:
        id:
          type: integer
        rank:
          type: integer
          description: Overall rank; with `search` it is the rank in the full ranking (0 if not found).
        maxPlayers:
          type: integer
        elo:
          type:
          - integer
          - string
          - 'null'
          description: 'ELO ladder: integer ELO. Points ladder: string `"<points> (<elo>)"`.'
        image:
          type: string
          format: uri
        flag:
          type: string
          format: uri
          description: Absolute URL of the flag image (`/images/flags/<country>.png`).
        name:
          type: string
        slug:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        mode:
          type:
          - string
          - 'null'
        isEligibleForMatch:
          type: boolean
          description: false when the viewer is a member of this team. Only filled for logged-in website users; true for API
            clients.
        winRatio:
          type:
          - string
          - integer
          - 'null'
          description: e.g. `"57%"`, or `"-"` with no games.
        currentUser:
          $ref: '#/components/schemas/CompTeamCurrentUser'
        inactiveSince:
          type:
          - string
          - 'null'
          description: Always null here.
        readyToPlay:
          type: boolean
      required:
      - id
      - rank
      - maxPlayers
      - elo
      - image
      - flag
      - name
      - slug
      - wins
      - losses
      - draws
      - mode
      - isEligibleForMatch

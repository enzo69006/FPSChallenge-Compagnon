    get:
      operationId: getSoloQueueLeaderboard
      tags:
      - Solo queue
      summary: Solo queue player stats leaderboard
      description: Per-player stats of this queue, 25 per page (respects each player's stats reset). Totals are refreshed
        about every 20 minutes and the list is cached for about 60 seconds. FPS Rating is damped by rounds/2000. `pinnedPlayer`
        is only filled for logged-in website users; null for API clients.
      parameters:
      - name: region
        in: path
        required: true
        schema:
          type: string
        description: Region slug (e.g. `eu`). Unknown slug returns 404.
      - name: game
        in: path
        required: true
        schema:
          type: string
        description: Game slug (e.g. `cod4`, `cod2`, `cod1`). Unknown slug returns 404.
      - name: soloQueueSlug
        in: path
        required: true
        schema:
          type: string
        description: 'Solo queue slug within the region and game. An unknown or deleted queue returns 404 `{message: ''Solo
          queue not found''}`.'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (integer >= 1, otherwise 422).
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Accepted but not used; the page size is fixed.
      - name: competitionType
        in: query
        required: false
        schema:
          type: string
          enum:
          - ladder
          - tournament
          - matchmaking
        description: Accepted (422 on other values) but not used by this endpoint.
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive substring match on the username.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - fpsRating
          - games
          - score
          - kd
          - kills
          - assists
          - deaths
          - grenades
          - plants
          - defuses
          - headshots
          - damage
          - accuracy
        description: 'Sort column. Unknown values are ignored (default order: FPS Rating, then K/D, then score). `rank` in
          each row stays the overall rank.'
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Anything other than `asc` means `desc`.
      - name: view
        in: query
        required: false
        schema:
          type: string
          default: perMap
        description: '`absolute` sorts by totals; any other value (default `perMap`) sorts by per-map averages. Only affects

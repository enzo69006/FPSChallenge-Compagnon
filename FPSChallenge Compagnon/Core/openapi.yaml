      - id
      - name
      - slug
      - elo
      - mode
      - matchesCount
      - readyTeamsCount
      - isLoggedIn
      - isSupporter
      - myCaptainTeams
      - myReadyTeamId
      additionalProperties: false
    CompLadderShow:
      type: object
      properties:

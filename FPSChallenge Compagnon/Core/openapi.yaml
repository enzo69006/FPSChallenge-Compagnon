            region:
              $ref: '#/components/schemas/CompRegion'
            game:
              $ref: '#/components/schemas/CompGame'
          required:
          - league
          - region
          - game
          description: Ladder details.
          additionalProperties: false
      required:
      - data
      additionalProperties: false
    CompTeamCurrentUser:
      type: object
      properties:
        isMember:
          type: boolean

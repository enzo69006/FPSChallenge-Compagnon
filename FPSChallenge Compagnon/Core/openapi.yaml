                type: array
                items:
                  type: object
                  required:
                  - label
                  - description
                  - url
                  - size
                  - kind
                  properties:
                    label:
                      type: string
                    description:
                      type: string
                    url:
                      type: string
                    size:
                      type:
                      - string
                      - 'null'
                    kind:
                      type: string
                      enum:
                      - patch
                      - anticheat
                      - disc
              steps:
                type: array
                items:
                  type: object
                  required:
                  - title
                  - items
                  - code
                  - topic
                  properties:
                    title:
                      type: string
                    items:
                      type: array
                      items:
                        type: string
                        description: Sanitised inline HTML fragment.
                    code:
                      type:
                      - string
                      - 'null'
                      description: Preformatted plain text.
                    topic:
                      type:
                      - string
                      - 'null'
                      enum:
                      - identifier
                      - anticheat
                      - teamspeak
                      - null
        troubleshooting:
          type: array
          items:
            type: object
            required:
            - title
            - items
            properties:
              title:
                type: string
              items:
                type: array
                items:
                  type: string
                  description: Sanitised inline HTML fragment.
        tools:
          type: array
          items:
            type: object
            required:
            - label
            - description
            - url
            properties:
              label:
                type: string
              description:
                type: string
              url:
                type: string
    CorePlayPage:
      type: object
      required:

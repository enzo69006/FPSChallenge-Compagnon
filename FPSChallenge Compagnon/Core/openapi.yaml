                    slug:
                      type: string
                      description: Game slug.
                    pinnedPlayer:
                      oneOf:
                      - $ref: '#/components/schemas/CompLeaderboardPinnedRow'
                      - type: 'null'
                  required:
                  - slug
                  - pinnedPlayer
        '404':
          description: 'Unknown region/game slug, or solo queue not found (`{message: ''Solo queue not found''}`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompMessage'
        '422':

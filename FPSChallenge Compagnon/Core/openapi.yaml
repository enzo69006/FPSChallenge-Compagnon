      description: Local wall-clock time "Y-m-d H:i:s" in the server timezone (Europe/Bratislava), no offset, or "N/A".
      examples:
      - '2026-10-28 19:30:00'
    SocFlagUrl:
      type: string
      format: uri
      description: Absolute URL of a flag image (/images/flags/{code}.png)
    SocImageUrl:
      type: string
      format: uri
      description: Absolute CDN URL; a stock image when none was uploaded
    SocRegistrationCounter:
      type: object
      required:
      - registrationUnit
      - registrationCount
      - registrationMin
      - registrationMax
      description: Registration counter as shown on the website. Unit "players" for drafts and 1v1, otherwise "teams". min/max
        are derived from the team limits.
      properties:
        registrationUnit:
          type: string
          enum:
          - players
          - teams
        registrationCount:
          type: integer
        registrationMin:
          type: integer
        registrationMax:
          type: integer
    SocTournamentState:
      type: string
      enum:
      - ANNOUNCE
      - REGISTRATION
      - CHECKIN
      - WAITING_FOR_CHECKIN
      - WAITING_FOR_START
      - ONGOING
      - FINISHED
      - CANCELLED
    SocTournamentListItem:
      allOf:
      - $ref: '#/components/schemas/SocRegistrationCounter'
      - type: object
        required:
        - id
        - name
        - slug
        - state
        - start
        - teamsCount
        - playerBaseCount
        - image
        - gameName
        properties:
          id:
            type: integer
          name:
            type: string
            description: May carry a "[EU] " / "[EMEA] " prefix
          slug:
            type: string
          state:
            $ref: '#/components/schemas/SocTournamentState'
          mode:
            type:
            - string
            - 'null'
            description: e.g. free / paid (P2P)
          start:
            $ref: '#/components/schemas/SocLocalDateTime'
          teamsCount:
            type: integer
            description: Registration rows (prefer registrationCount)
          maxTeams:
            type:
            - integer
            - 'null'
          playerBaseCount:
            type: integer
            description: Players per team (versus)
          image:
            $ref: '#/components/schemas/SocImageUrl'
          gameName:
            type: string
    SocTournamentList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SocTournamentListItem'
        meta:
          type: object
          required:
          - currentPage
          - lastPage
          - total
          - perPage
          properties:
            currentPage:
              type: integer
            lastPage:
              type: integer
            total:
              type: integer
            perPage:
              type: integer
              const: 8
    SocTournamentPlayerRef:
      type: object
      required:
      - id
      - username
      - flag
      properties:
        id:
          type: integer
        username:
          type: string
        flag:
          $ref: '#/components/schemas/SocFlagUrl'
    SocTournamentMyTeam:
      type: object
      description: The viewer's own registration in this tournament. Only filled for logged-in website users; null for API
        clients.
      required:
      - id
      - teamId
      - name
      - slug
      - image
      - captain
      - checkedIn
      - isCaptain
      - canRename
      - renameNeedsVip
      - players
      - inviteable
      properties:
        id:
          type: integer
          description: Registration id
        teamId:
          type: integer
          description: Team id
        name:
          type: string
        slug:
          type: string
        image:
          $ref: '#/components/schemas/SocImageUrl'
        captain:
          type: integer
          description: User id of the tournament captain
        checkedIn:
          type: boolean
        changesLeft:
          type:
          - integer
          - 'null'
          description: League mode line-up changes left
        isCaptain:
          type: boolean
        tag:
          type:
          - string
          - 'null'
        canRename:
          type: boolean
          description: Captain of an open drafted team with VIP
        renameNeedsVip:
          type: boolean
          description: Captain of an open drafted team without VIP
        players:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/SocTournamentPlayerRef'
            - type: object
              required:
              - substitute
              - isCaptain
              properties:
                substitute:
                  type: boolean
                isCaptain:
                  type: boolean
        inviteable:
          type: array
          description: Members of the team not yet in this tournament
          items:
            $ref: '#/components/schemas/SocTournamentPlayerRef'
    SocTournamentExtraPrize:
      type: object
      required:
      - place
      - rewardType
      properties:
        place:
          type: integer
        rewardType:
          type: string
          enum:
          - vip_hours
          - elo_reset
          - username_change
          - custom
        rewardAmount:
          type:
          - integer
          - 'null'
          description: VIP in HOURS, credits as count; null for custom
        rewardText:
          type:
          - string
          - 'null'
          description: Free text for custom (e.g. "5000 EUR")
    SocTournamentDetail:
      allOf:
      - $ref: '#/components/schemas/SocRegistrationCounter'
      - type: object
        required:
        - id
        - name
        - slug
        - state
        - version
        - start
        - checkinRequired
        - teamsCount
        - playerBaseCount
        - league
        - isDraft
        - statsAvailability
        - gameName
        - gameSlug
        - image
        - isFinished
        - showGroups
        - showSchedule
        - showPlayoffs
        - mapPool
        - extraPrizes
        - isLoggedIn
        properties:
          id:
            type: integer
          name:
            type: string
          slug:
            type: string
          state:
            $ref: '#/components/schemas/SocTournamentState'
          mode:
            type:
            - string
            - 'null'
          version:
            type: integer
            description: 1 = legacy brackets, 2 = v2 playoff stages
          description:
            type:
            - string
            - 'null'
            description: HTML fragment for the website
          start:
            $ref: '#/components/schemas/SocLocalDateTime'
          registrationStart:
            $ref: '#/components/schemas/SocLocalDateTime'
          registrationEnd:
            $ref: '#/components/schemas/SocLocalDateTime'
          checkinStart:
            $ref: '#/components/schemas/SocLocalDateTime'
          checkinEnd:
            $ref: '#/components/schemas/SocLocalDateTime'
          checkinRequired:
            type: boolean
            description: When false the check-in dates are meaningless (equal to registrationEnd)
          minTeams:
            type:
            - integer
            - 'null'
          maxTeams:
            type:
            - integer
            - 'null'
          teamsCount:
            type: integer
          playerBaseCount:
            type: integer
          playerSubCount:
            type:
            - integer
            - 'null'
          league:
            type: boolean
          isDraft:
            type: boolean
          draftedAt:
            type:
            - string
            - 'null'
            format: date-time
          draftMode:
            type:
            - string
            - 'null'
            enum:
            - auto
            - captain_pick
            - null
          draftStartedAt:
            type:
            - string
            - 'null'
            format: date-time
            description: Captain pick running while set and draftedAt null
          statsAvailability:
            type: boolean
          gameName:
            type: string
          gameSlug:
            type: string
          image:
            $ref: '#/components/schemas/SocImageUrl'
          isFinished:
            type: boolean
          showGroups:
            type: boolean
          showSchedule:
            type: boolean
          groupsUrl:
            type:
            - string
            - 'null'
            description: Web path of the groups page
          showPlayoffs:
            type: boolean
          playoffStageId:
            type:
            - integer
            - 'null'
            description: v2 stage id for the bracket endpoint
          bracketTeams:
            description: Legacy (version 1) bracket JSON, decoded as stored
            type:
            - 'null'
            - object
            - array
          skipConsolationRound:
            type: boolean
          mapPool:
            type: array
            items:
              type: object
              required:
              - name
              - image
              properties:
                name:
                  type: string
                image:
                  $ref: '#/components/schemas/SocImageUrl'
          frsSystem:
            type:
            - string
            - 'null'
            description: FRS season key, e.g. "2026"
          frsCategory:
            type:
            - string
            - 'null'
            description: e.g. SMALL / MEDIUM / BIG
          frsPrizes:
            type:
            - 'null'
            - object
            description: 'FRS config prizes keyed by place, e.g. {"1": {"vip_days": 30}}'
            additionalProperties:
              type: object
              properties:
                vip_days:
                  type: integer
          frsMinTeams:
            type:
            - integer
            - 'null'
            description: Competing teams needed for any FRS payout (8)
          extraPrizes:
            type: array
            items:
              $ref: '#/components/schemas/SocTournamentExtraPrize'
          isLoggedIn:
            type: boolean
          currentUserId:
            type:
            - integer
            - 'null'
          myTeam:
            oneOf:
            - $ref: '#/components/schemas/SocTournamentMyTeam'
            - type: 'null'
    SocTournamentRule:
      type: object
      required:
      - ordering
      - title
      - content
      properties:
        ordering:
          type: integer
        title:
          type: string
        content:
          type: string
          description: Escaped text with <br /> line breaks
    SocTournamentTeam:
      type: object
      required:
      - id
      - name
      - slug
      - flag
      - image
      - accepted
      - checkedIn
      - inProgress
      - members
      properties:
        id:
          type: integer
          description: Team id
        name:
          type: string
        slug:
          type: string
        flag:
          $ref: '#/components/schemas/SocFlagUrl'
        image:
          $ref: '#/components/schemas/SocImageUrl'
        accepted:
          type: boolean
          description: False while awaiting manual confirmation
        checkedIn:
          type: boolean
        inProgress:
          type: boolean
          description: Whether check-in badges are meaningful
        frs:
          type:
          - number
          - 'null'
          description: Average member FRS, 2 decimals
        registeredAt:
          type:
          - string
          - 'null'
          format: date-time
        members:
          type: array
          items:
            type: object
            required:
            - id
            - username
            - formattedUsername
            - flag
            properties:
              id:
                type: integer
              username:
                type: string
              formattedUsername:
                $ref: '#/components/schemas/SocFormattedUsername'
              flag:
                $ref: '#/components/schemas/SocFlagUrl'
    SocFormattedUsername:
      type: string
      description: Username, possibly wrapped in an HTML span with a role colour class (`<span class='username-color ...'>name</span>`).
        HTML fragment for the website; prefer `username`.
    SocTournamentStatRow:
      type: object
      description: All values are display strings ("-" = not tracked for this game)
      properties:
        username:
          type: string
        flag:
          $ref: '#/components/schemas/SocFlagUrl'
        teamName:
          type: string
        teamSlug:
          type: string
        fpsRating:
          type: string
          description: 2 decimals or "-"
        fpsColor:
          type: string
          description: Rating tier colour (blue/green/yellow/orange/red)
        games:
          type: integer
        maps:
          type: integer
        score:
          type: string
        scoreAbsolute:
          type: string
        kd:
          type: string
        kdColor:
          type: string
          enum:
          - blue
          - green
          - yellow
          - orange
          - red
        kills:
          type: string
        killsAbsolute:
          type: string
        assists:
          type: string
        assistsAbsolute:
          type: string
        deaths:
          type: string
        deathsAbsolute:
          type: string
        headshots:
          type: string
          description: Percent of kills, e.g. "34%"
        damage:
          type: string
        damageAbsolute:
          type: string
        accuracy:
          type: string
          description: CoD4 only
        plants:
          type: string
        plantsAbsolute:
          type: string
        defuses:
          type: string
        defusesAbsolute:
          type: string
        grenades:
          type: string
          description: CoD1/CoD2 only
        grenadesAbsolute:
          type: string
    SocTournamentStats:
      type: object
      required:
      - gameSlug
      - stats
      - isVip
      properties:
        gameSlug:
          type: string
        stats:
          type: array
          items:
            $ref: '#/components/schemas/SocTournamentStatRow'
        isVip:
          type: boolean
          description: Viewer has VIP. Only filled for logged-in website users; false for API clients.
    SocGroupMatchTeam:
      type: object
      required:
      - status
      - id
      - name
      - tag
      - score
      properties:
        status:
          type: string
          enum:
          - win
          - lose
          - draw
        id:
          type: integer
        name:
          type: string
        tag:
          type: string
          description: Team slug
        score:
          type:
          - integer
          - 'null'
    SocTournamentGroupMatch:
      type: object
      required:
      - id
      - statusId
      - isCancelled
      - isFinished
      - isOngoing
      - homeTeam
      - awayTeam
      - maps
      properties:
        id:
          type: integer
          description: Match id
        statusId:
          type: integer
          description: Match status constant
        statusLabel:
          type:
          - string
          - 'null'
          enum:
          - VETO
          - Ongoing
          - Finished
          - Dispute
          - null
        isCancelled:
          type: boolean
        isFinished:
          type: boolean
        isOngoing:
          type: boolean
        homeTeam:
          $ref: '#/components/schemas/SocGroupMatchTeam'
        awayTeam:
          $ref: '#/components/schemas/SocGroupMatchTeam'
        maps:
          type: array
          items:
            type: object
            required:
            - id
            - image
            properties:
              id:
                type: integer
              name:
                type:
                - string
                - 'null'
              image:
                type: string
              homeScore:
                type:
                - integer
                - 'null'
              awayScore:
                type:
                - integer
                - 'null'
    SocTournamentGroup:
      type: object
      required:
      - id
      - slug
      - label
      - teams
      - rounds
      properties:
        id:
          type: integer
        slug:
          type: string
        label:
          type: string
        teams:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: integer
              name:
                type: string
              slug:
                type: string
              flag:
                $ref: '#/components/schemas/SocFlagUrl'
              wins:
                type: integer
              draws:
                type: integer
              losses:
                type: integer
              points:
                type: integer
              mapsFor:
                type: integer
              mapsAgainst:
                type: integer
              mapsDifference:
                type: integer
              scoreFor:
                type: integer
              scoreAgainst:
                type: integer
              scoreDifference:
                type: integer
              lastResults:
                type: array
                description: Up to 5 single-character results (e.g. W/L/D)
                items:
                  type: string
        rounds:
          type: array
          items:
            type: object
            required:
            - id
            - matches
            properties:
              id:
                type: integer
              label:
                type:
                - string
                - 'null'
              projectedStart:
                type:
                - string
                - 'null'
                description: Stored local time (Europe/Bratislava)
              description:
                type:
                - string
                - 'null'
              matches:
                type: array
                items:
                  $ref: '#/components/schemas/SocTournamentGroupMatch'
    SocTournamentGroupLink:
      type: object
      required:
      - id
      - slug
      - label
      properties:
        id:
          type: integer
        slug:
          type: string
        label:
          type: string
    SocTournamentGroupsAll:
      type: object
      required:
      - groupType
      - advanceNumber
      - scheduled
      - sameSchedule
      - groups
      - allGroups
      properties:
        groupType:
          type:
          - string
          - 'null'
        advanceNumber:
          type:
          - integer
          - 'null'
          description: Teams advancing per group
        scheduled:
          type: boolean
        sameSchedule:
          type: boolean
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SocTournamentGroupLink'
        allGroups:
          type: array
          items:
            $ref: '#/components/schemas/SocTournamentGroup'
    SocTournamentGroupsOne:
      type: object
      required:
      - groupType
      - advanceNumber
      - groups
      - activeGroup
      properties:
        groupType:
          type:
          - string
          - 'null'
        advanceNumber:
          type:
          - integer
          - 'null'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SocTournamentGroupLink'
        activeGroup:
          $ref: '#/components/schemas/SocTournamentGroup'
    SocTournamentStandingRow:
      type: object
      required:
      - place
      - minPlace
      - maxPlace
      - team
      - members
      properties:
        place:
          type: integer
        minPlace:
          type: integer
        maxPlace:
          type: integer
          description: Differs from minPlace for tied ranges (e.g. 5-8)
        frsPoints:
          type:
          - number
          - 'null'
        team:
          type: object
          required:
          - name
          - slug
          - flag
          - image
          properties:
            name:
              type: string
            slug:
              type: string
            flag:
              $ref: '#/components/schemas/SocFlagUrl'
            image:
              $ref: '#/components/schemas/SocImageUrl'
        members:
          type: array
          items:
            type: object
            required:
            - username
            - formattedUsername
            - flag
            properties:
              username:
                type: string
              formattedUsername:
                $ref: '#/components/schemas/SocFormattedUsername'
              flag:
                $ref: '#/components/schemas/SocFlagUrl'
              frsPoints:
                type:
                - number
                - 'null'
    SocDraftRoomPlayer:
      type: object
      required:
      - id
      - username
      - rating
      properties:
        id:
          type: integer
        username:
          type: string
        image:
          type:
          - string
          - 'null'
          format: uri
          description: Avatar CDN URL, null when none
        flag:
          type:
          - string
          - 'null'
          format: uri
        rating:
          type: number
          description: Draft rating, 1 decimal
        pickNumber:
          type:
          - integer
          - 'null'
          description: Overall pick (1-based); null for captains and pool
    SocDraftRoomTeam:
      type: object
      required:
      - id
      - name
      - tag
      - seeding
      - captainUserId
      - averageRating
      - members
      properties:
        id:
          type: integer
          description: Registration id
        name:
          type: string
        tag:
          type: string
        seeding:
          type: integer
        captainUserId:
          type: integer
        averageRating:
          type: number
        members:
          type: array
          description: Captain first, then pick order
          items:
            $ref: '#/components/schemas/SocDraftRoomPlayer'
    SocDraftRoom:
      type: object
      required:
      - isActive
      - isComplete
      - secondsRemaining
      - pickNumber
      - totalPicks
      - teamSize
      - upcomingTournamentTeamIds
      - teams
      - pool
      properties:
        isActive:
          type: boolean
          description: Picks are running
        isComplete:
          type: boolean
          description: Draft finished
        secondsRemaining:
          type: integer
          description: Seconds left for the current pick (server clock)
        expiresAt:
          type:
          - integer
          - 'null'
          description: Unix timestamp of the current pick deadline
        currentTournamentTeamId:
          type:
          - integer
          - 'null'
        currentCaptainUserId:
          type:
          - integer
          - 'null'
        pickNumber:
          type: integer
        totalPicks:
          type: integer
        teamSize:
          type: integer
        lastPickedUserId:
          type:
          - integer
          - 'null'
        upcomingTournamentTeamIds:
          type: array
          description: Next 8 teams on the clock, starting with the current turn
          items:
            type: integer
        teams:
          type: array
          items:
            $ref: '#/components/schemas/SocDraftRoomTeam'
        pool:
          type: array
          description: Unpicked players, strongest first
          items:
            $ref: '#/components/schemas/SocDraftRoomPlayer'
